# 4편 블로그 시나리오. steps/p4_scenarios.py가 읽어 실제 모델로 돌리고 blog/logs/p4_<id>_<시각>.json에 남긴다.
# 사용법은 docs/testing.md.
#
#   stage    1 = 비서 코드 안의 도구만 / 2 = + 기성 MCP(time·filesystem·notion) / 3 = + 직접 만든 그룹웨어 MCP / 5 = 3 + Skill
#   user     그룹웨어 사용자(패널 오른쪽 위에서 고르는 사람)
#   approval 쓰기 도구가 멈췄을 때: approve | reject | edit (args로 고친 인자, comment로 의견). 목록이면 멈출 때마다 차례로
#   seen     2026-11-24에 이미 돌려 본 결과 (agent.runs의 id). 같은 질문이라도 실행마다 달라질 수 있다.

scenarios:
  # ---------------- 1장 Tool Calling
  - id: p1_oom
    chapter: 1
    stage: 1
    question: "10월에 OOM 장애가 있었어?"
    purpose: 도구 호출 한 번의 네 단계(스키마 → 프롬프트 글자 → 모델 출력 글자 → 파싱·실행·결과 붙이기)를 처음부터 끝까지 보여 준다
    look_for: [첫 토큰 <function 확률, 두 번째 프롬프트에 새로 붙은 글자(<|eom_id|> + ipython 결과), 근거 id]
  - id: p1_reject_month
    chapter: 1
    stage: 1
    question: "보안팀이 반려한 결재가 있었어? 사유도 알려 줘"
    purpose: 도구 인자 설계의 한계 — month 하나만 받는 도구라 오늘(11월)로 찾고 빈 결과
    look_for: [gw_list_approvals month=2026-11, 빈 결과, 지어낸 근거 approval:0]
    seen: 37de0c386c
  - id: p1_reject_oct
    chapter: 1
    stage: 1
    question: "10월에 보안팀이 반려한 결재가 있었어? 반려 사유도 알려 줘"
    purpose: 반환값 설계의 한계 — 목록에 사유가 없는데 읽기 도구를 부르지 않고 끝냄
    look_for: [approval:4는 찾음, gw_read_approval을 부르지 않음, "반려 사유: [approval:4]"]
    seen: bb8ca2b668
  - id: p1_no_tool
    chapter: 1
    stage: 1
    question: "안녕! 너는 뭘 할 수 있어?"
    purpose: 도구가 필요 없는 질문 — 첫 토큰이 바로 글자로 시작한다
    look_for: [첫 토큰 확률(안 99.99%), 호출 없음]

  # ---------------- 2장 MCP 붙이기
  - id: p2_time
    chapter: 2
    stage: 2
    question: "지금 뉴욕은 몇 시야?"
    purpose: 기성 MCP 서버(time) 호출이 JSON-RPC로 오가는 모습. 모델 입장에서는 1장 도구와 구별이 없다
    look_for: [→ tools/call / ← 응답 원문, 도구 출처 MCP time, 지어낸 근거 get_current_time:1]
  - id: p2_files
    chapter: 2
    stage: 2
    question: "비서가 만든 보고서 파일이 뭐가 있어? 파일 이름 알려 줘"
    purpose: 허용 목록으로 도구를 줄이다 필요한 도구(list_allowed_directories)를 뺀 경우
    look_for: [search_files path=/, Access denied(isError), 다시 시도하지 않고 포기]
  - id: p2_notion
    chapter: 2
    stage: 2
    question: "Notion에 있는 AGENT Architecture 페이지 내용을 요약해 줘"
    purpose: 남이 만든 서버의 도구(Notion) — 프롬프트가 7천 토큰을 넘고, 검색 없이 page_id를 지어냄
    look_for: [도구 21개 프롬프트 토큰, 지어낸 page_id, 400인데 isError 아님, 사용자에게 되물음]
    seen: b9ee07dcfa

  # ---------------- 3장 그룹웨어 MCP 서버 직접 만들기
  - id: p3_reject
    chapter: 3
    stage: 3
    question: "보안팀이 반려한 결재가 있었어? 사유도 알려 줘"
    purpose: 1장 p1_reject_month와 같은 질문. 기간 범위·사유를 함께 주는 서버 도구로 한 번에 답한다
    look_for: [find_approvals 한 번, last_decision.comment, 깨진 JSON을 스스로 고치는 장면(나올 수도 있음)]
    seen: 9c1f000078
  - id: p3_mail_approve
    chapter: 3
    stage: 3
    user: jaehwi
    question: "박지영 팀장님께 내일 오전 10시에 10월 운영 보고 리뷰 회의를 하자고 메일 보내 줘"
    approval: approve
    purpose: 쓰기 도구 앞에서 코드가 멈추고 사람이 승인 → 그룹웨어에 실제로 메일이 들어간다(보낸 사람 = 지금 사용자)
    look_for: [승인 카드, _meta local.office/user, mail:N 근거]
  - id: p3_mail_reject
    chapter: 3
    stage: 3
    user: jaehwi
    question: "박지영 팀장님께 내일 오전 10시에 10월 운영 보고 리뷰 회의를 하자고 메일 보내 줘"
    approval: [reject, approve]          # 처음은 의견과 함께 거절, 고쳐서 다시 부르면 승인
    comment: "제목 앞에 [리뷰]를 붙여서 다시 보내 줘"
    purpose: 거절 의견이 모델에게 돌아간다 — 의견대로 고쳐서 다시 부르는지
    look_for: [거절 의견이 다음 프롬프트에 들어감, 두 번째 send_mail의 subject]
    seen: [88ab2e84a3, ffb8d78c70]        # 거절 의견대로 제목을 "[리뷰] …"로 고쳐 다시 부름 (ffb8: 승인 후 발송, 답은 원래 제목으로 말함)
  - id: p3_event
    chapter: 3
    stage: 3
    user: jaehwi
    question: "다음 주 화요일 오후 3시에 이서준 책임이랑 GPU 증설 검토 회의 1시간 잡아 줘"
    approval: approve
    purpose: 날짜 계산(time 도구) + 이름으로 참석자 지정 + 쓰기 승인
    look_for: [날짜를 맞게 계산했는지, attendees에 이름, create_event]
  - id: p3_monthly
    chapter: 3
    stage: 3
    question: "10월 월간 업무 보고 초안 써 줘"
    purpose: Skill 없이 같은 일을 시켰을 때(5장 p5_monthly와 비교)
    look_for: [도구를 몇 번 부르는지, 근거가 실제 ref인지]

  # ---------------- 5장 Skills
  - id: p5_notion
    chapter: 5
    stage: 5
    question: "Notion에 있는 AGENT Architecture 페이지 내용을 요약해 줘"
    purpose: 2장 p2_notion과 같은 질문. Skill을 고르고 도구가 2개로 줄어든다 → 그다음 절차를 따르는지
    look_for: [load_skill, 도구 15→2, 프롬프트 토큰 감소, 두 번째 호출 첫 토큰 <의 확률]
    seen: [67874da753, dc98c5e2e9]
  - id: p5_monthly
    chapter: 5
    stage: 5
    question: "10월 월간 업무 보고 초안 써 줘"
    purpose: 절차를 불러와도 8B가 도구 없이 보고서를 지어낸 장면
    look_for: [load_skill monthly-report, 프롬프트 1,600토큰대, 도구 호출 0번, 가짜 근거]
    seen: 539bf30ef8
  - id: p5_dgx
    chapter: 5
    stage: 5
    question: "Notion의 DGX SETTING 페이지 요약해 줘"
    purpose: 같은 Skill을 다른 페이지로. 절차를 글로 늘어놓고 끝나는지
    look_for: [두 번째 호출 첫 토큰 후보(<가 몇 %)]
  - id: p5_plain
    chapter: 5
    stage: 5
    question: "보안팀이 반려한 결재가 있었어? 사유도 알려 줘"
    purpose: Skill이 필요 없는 질문 — load_skill을 부르지 않고 바로 기본 도구로 가는지
    look_for: [load_skill 없이 find_approvals]
