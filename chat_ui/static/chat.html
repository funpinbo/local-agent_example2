<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 챗봇 · 놀러가자</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e3e2dc;--acc:#2f6fdf;--acc-weak:#e8effd;
--ok:#1f8a4c;--warn:#b7791f;--err:#c53030;--code:#f3f2ee;--tool:#7a4cc2;--tool-weak:#f1eafb;--state:#0f766e;--state-weak:#e6f4f2}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--mute:#9b9a93;--line:#33322e;--acc:#7aa5f5;
--acc-weak:#1d2a44;--code:#262522;--tool:#b89af0;--tool-weak:#2a2238;--state:#5ec4b6;--state-weak:#17302d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif}
nav{display:flex;gap:18px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav b{font-size:15px}nav a{color:var(--mute);text-decoration:none}nav a.on{color:var(--acc);font-weight:600}
nav .meta{margin-left:auto;color:var(--mute);font-size:12px}
.wrap{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 45px)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{font-size:12px;letter-spacing:.04em;color:var(--mute);margin:16px 0 8px;text-transform:uppercase}
.stage{margin-bottom:6px}
.stage>button{width:100%;text-align:left;background:none;border:0;padding:6px 4px;font-weight:600;color:var(--ink);cursor:pointer}
.items{display:none;padding-left:6px}.stage.open .items{display:block}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--ink);cursor:pointer;font-size:13px}
.item:hover{background:var(--acc-weak)}.item.on{background:var(--acc);color:#fff}
.desc{font-size:12.5px;color:var(--mute);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px}
.desc code{font-size:11.5px}
.opt{margin-top:8px}.opt label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
select,textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mute);font-size:12.5px;cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--acc-weak)}
.files{list-style:none;padding:0;margin:8px 0 0}.files li{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.files button{border:0;background:none;color:var(--err);cursor:pointer}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;color:var(--mute)}
main{display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;padding:18px 22px}
.empty{color:var(--mute);text-align:center;margin-top:12vh}
.msg{max-width:980px;margin:0 auto 14px}
.user{background:var(--acc);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;margin-left:auto;width:fit-content;max-width:75%;white-space:pre-wrap}
.user small{display:block;opacity:.8;font-size:11.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card header{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.card header .f{color:var(--mute);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}
.badge.running{background:var(--acc-weak);color:var(--acc)}.badge.done{background:#e3f4ea;color:var(--ok)}
.badge.waiting{background:#fdf1dc;color:var(--warn)}.badge.error{background:#fde8e8;color:var(--err)}
@media (prefers-color-scheme:dark){.badge.done{background:#163322}.badge.waiting{background:#3a2c12}.badge.error{background:#3d1a1a}}
.tl{padding:6px 14px 10px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.node{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--bg);color:var(--mute);margin-right:6px}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.call{display:inline-block;background:var(--tool-weak);color:var(--tool);border-radius:6px;padding:2px 8px;margin:3px 4px 0 0;font-size:12.5px;font-weight:600}
.res{border-left:3px solid var(--tool);padding-left:8px}
.st{border-left:3px solid var(--state);padding-left:8px}
.warn{color:var(--err);font-size:12.5px}
details{margin-top:3px}summary{cursor:pointer;color:var(--mute);font-size:12.5px}
pre{background:var(--code);border-radius:8px;padding:8px 10px;overflow:auto;max-height:340px;font-size:12px;margin:5px 0 0;white-space:pre-wrap;word-break:break-word}
.result{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg)}
.result h4{margin:0 0 6px;font-size:13px}
.answer{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:6px}
.sec b{display:block;margin-bottom:2px}
.cite{display:inline-block;font-size:11.5px;background:var(--acc-weak);color:var(--acc);border-radius:5px;padding:0 5px;margin:0 2px}
.dl{display:inline-block;margin:6px 8px 0 0;color:var(--acc)}
.hitl{border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel)}
.hitl .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.p{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 22px}
.composer .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:220px;resize:vertical}
.hint{max-width:980px;margin:0 auto 6px;color:var(--mute);font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mute)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}#log{min-height:50vh}}
</style>
</head>
<body>
<nav><b>놀러가자</b><a href="/">그룹웨어</a><a class="on" href="/chat">에이전트 챗봇</a><span class="meta" id="meta"></span></nav>
<div class="wrap">
  <aside>
    <h3>설계 방식</h3>
    <div id="stages"></div>
    <div id="desc" class="desc"></div>
    <div id="opts"></div>
    <h3>문서 업로드</h3>
    <div class="drop" id="drop">파일을 끌어다 놓거나 눌러서 고르기<br><small>.md · .txt · .docx — 사내 문서와 함께 검색됩니다</small></div>
    <input type="file" id="file" accept=".md,.txt,.docx" multiple hidden>
    <ul class="files" id="files"></ul>
    <label class="chk"><input type="checkbox" id="useUploads" checked> 문서 검색에 올린 문서 포함</label>
  </aside>
  <main>
    <div id="log"><div class="empty" id="empty">왼쪽에서 설계 방식을 고르고 아래에 입력해 실행하세요.<br>노드마다 LLM의 도구 호출과 도구 결과, State 변화가 순서대로 보입니다.</div></div>
    <div class="composer">
      <div class="hint" id="hint"></div>
      <div class="in">
        <textarea id="text" placeholder=""></textarea>
        <button class="p" id="send">실행</button>
      </div>
    </div>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
let catalog = [], current = null, busy = false;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = v => typeof v === "string" ? v : JSON.stringify(v, null, 2);
const cites = s => esc(s).replace(/\[((?:mail|event|approval):\d+|[0-9A-Za-z_\-]+#\d+)\]/g, '<span class="cite">$1</span>');

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m) }
  return r.json();
}

async function init() {
  const c = await api("/chat/api/catalog");
  catalog = c.stages;
  $("#meta").innerHTML = `모델 ${esc(c.model)} · MSDF ${esc(c.msdf_mode)}` +
    (c.msdf_mode === "remote" ? ` · <a href="${esc(c.msdf_ui)}" target="_blank">MSDF UI ↗</a>` : ` <span title="local 모드에서는 MSDF 엔진이 이 서버 안에서 돌아 MSDF 웹 UI에는 나타나지 않습니다. 타임라인의 'MSDF 요청'에서 확인하세요.">ⓘ</span>`);
  $("#stages").innerHTML = catalog.map((s, i) => `
    <div class="stage ${i < 2 ? "open" : ""}"><button onclick="this.parentNode.classList.toggle('open')">${esc(s.label)}</button>
      <div class="items">${s.items.map(it => `<button class="item" data-key="${it.key}">${esc(it.title)}</button>`).join("")}</div></div>`).join("");
  document.querySelectorAll(".item").forEach(b => b.onclick = () => select(b.dataset.key));
  select("chat_qa");
  loadFiles();
}

function find(key) { for (const s of catalog) for (const it of s.items) if (it.key === key) return it; }

function select(key) {
  current = find(key);
  document.querySelectorAll(".item").forEach(b => b.classList.toggle("on", b.dataset.key === key));
  $("#desc").innerHTML = `${esc(current.desc)}${current.file ? `<br><code>${esc(current.file)}</code>` : ""}`;
  const opts = [...current.options];
  if (current.input === "memo") {
    opts.push({key:"memo_source", label:"메모", choices:[["text","아래 입력창의 메모"],["upload","마지막으로 올린 문서"]]});
    opts.push({key:"sample_memo", label:"입력창이 비었을 때 쓸 예시 메모 (MSDF memo_text)", choices:[["weekly","주간 메모"],["trip","출장 메모"],["short","짧은 메모"]]});
  }
  $("#opts").innerHTML = opts.map(o => `<div class="opt"><label>${esc(o.label)}</label>
    <select data-opt="${o.key}">${o.choices.map(([v,l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select></div>`).join("");
  const t = $("#text");
  const hints = {
    question: ["질문을 입력하세요. 예: 2호기 OOM은 왜 났고 어떻게 대응했나요?", ""],
    memo: ["보고서로 만들 메모를 붙여 넣으세요. 비워 두면 예시 주간 메모를 씁니다.", ""],
    request: ["요청 문장. 비워 두면 예시 요청을 씁니다.", current.default_request],
    month: ["월은 왼쪽에서 고릅니다. 입력 없이 실행할 수 있습니다.", ""],
    none: ["입력 없이 실행합니다. 옵션은 왼쪽에서 고르세요.", ""],
  }[current.input];
  $("#hint").textContent = hints[0];
  t.placeholder = hints[1] || hints[0];
  t.value = "";
  t.disabled = ["month","none"].includes(current.input);
}

function optValues() {
  const o = {};
  document.querySelectorAll("[data-opt]").forEach(s => o[s.dataset.opt] = s.value);
  return o;
}

async function send() {
  if (busy || !current) return;
  const text = $("#text").value.trim();
  if (current.input === "question" && !text) { $("#text").focus(); return; }
  const body = {key: current.key, text, use_uploads: $("#useUploads").checked, ...optValues()};
  $("#empty")?.remove();
  const label = current.options.length ? " · " + current.options.map(o => {
    const v = body[o.key]; return (o.choices.find(c => c[0] === v) || [, v])[1]; }).join(" · ") : "";
  addUser(`${current.title}${label}`, text || (current.input === "memo" ? "(예시 메모)" : current.input === "request" ? "(예시 요청)" : ""));
  $("#text").value = "";
  busy = true; $("#send").disabled = true;
  try {
    const job = await api("/chat/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    track(job);
  } catch (e) { addError(e.message); busy = false; $("#send").disabled = false; }
}

function addUser(title, text) {
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="user"><small>${esc(title)}</small>${esc(text)}</div>`;
  $("#log").appendChild(d); scroll();
}
function addError(m) {
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="card"><div class="tl warn">${esc(m)}</div></div>`; $("#log").appendChild(d); scroll();
}
const scroll = () => { const l = $("#log"); l.scrollTop = l.scrollHeight; };
const atBottom = () => { const l = $("#log"); return l.scrollHeight - l.scrollTop - l.clientHeight < 80; };

function track(job) {
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="card"><header><b>${esc(job.title)}</b><span class="f"></span><span class="badge"></span><span class="f el" style="margin-left:auto"></span></header>
    <div class="tl"></div><div class="result" hidden></div></div>`;
  $("#log").appendChild(d);
  const tl = d.querySelector(".tl"), badge = d.querySelector(".badge"), el = d.querySelector(".el"), res = d.querySelector(".result");
  let since = 0, t0 = Date.now();
  const tick = async () => {
    let v;
    try { v = await api(`/chat/api/run/${job.id}?since=${since}`); } catch (e) { setTimeout(tick, 1500); return; }
    const stick = atBottom();
    v.events.forEach(ev => tl.insertAdjacentHTML("beforeend", renderEvent(ev)));
    since = v.next;
    badge.className = "badge " + v.status;
    badge.textContent = {queued:"대기", running:"실행 중", waiting:"결정 대기", done:"완료", error:"오류"}[v.status];
    el.textContent = ((Date.now() - t0) / 1000).toFixed(0) + "초";
    if (v.status === "done" || v.status === "error" || v.status === "waiting") {
      res.hidden = false; res.innerHTML = renderResult(v);
      if (v.status === "waiting") bindHitl(res, v, () => { res.hidden = true; t0 = Date.now() - 0; setTimeout(tick, 800); });
      else { busy = false; $("#send").disabled = false; }
      if (stick) scroll();
      if (v.status !== "running") return;
    }
    if (stick) scroll();
    setTimeout(tick, 900);
  };
  tick();
}

function renderEvent(ev) {
  const node = `<span class="node">${esc(ev.agent ? ev.agent + " · " : "")}${esc(ev.node)}</span>`;
  let body = "";
  if (ev.type === "ai") {
    const calls = ev.tool_calls.map(c => `<span class="call">🔧 ${esc(c.name)}</span><details><summary>인자</summary><pre>${esc(pretty(c.args))}</pre></details>`).join("");
    body = `<b>LLM</b>${ev.tokens ? ` <small style="color:var(--mute)">입력 ${ev.tokens}토큰</small>` : ""}
      ${ev.content ? `<div class="txt">${cites(ev.content)}</div>` : ""}${calls}
      ${ev.invalid && ev.invalid.length ? `<div class="warn">형식이 깨진 호출: ${esc(ev.invalid.join(" / "))}</div>` : ""}
      ${!ev.content && !ev.tool_calls.length ? `<div class="txt" style="color:var(--mute)">(빈 응답)</div>` : ""}`;
  } else if (ev.type === "tool") {
    const short = String(ev.content).length > 220;
    body = `<div class="res"><b>도구 결과</b> <span class="call">${esc(ev.name)}</span>
      ${short ? `<details><summary>${esc(String(ev.content).slice(0, 160))}…</summary><pre>${esc(ev.content)}</pre></details>` : `<div class="txt">${esc(ev.content)}</div>`}</div>`;
  } else if (ev.type === "state") {
    body = `<div class="st"><b>State</b> <small style="color:var(--mute)">${esc(Object.keys(ev.state).join(", "))}</small>
      <details><summary>내용 보기</summary><pre>${esc(pretty(ev.state))}</pre></details></div>`;
  } else if (ev.type === "msdf") {
    const ran = (ev.steps || []).map(s => `<span class="call" style="background:var(--state-weak);color:var(--state)">${esc(s)}</span>`).join("");
    const hit = (ev.cached || []).map(s => `<span class="call" style="background:var(--bg);color:var(--mute)">${esc(s)} (캐시)</span>`).join("");
    body = `<div class="st"><b>MSDF 요청</b> <span class="call">${esc(ev.order)}</span>
      <small style="color:var(--mute)">${esc(ev.mode)} · ${ev.sec}초 · ${ev.ok ? "완료" : "실패"} · request ${esc(String(ev.request_id).slice(0, 12))}</small>
      <div style="margin-top:3px">${ran || ""}${hit || ""}${!ran && !hit ? `<small style="color:var(--mute)">(단계 정보 없음)</small>` : ""}</div>
      <details><summary>params</summary><pre>${esc(pretty(ev.params))}</pre></details></div>`;
  } else if (ev.type === "human") {
    body = `<div class="txt">${esc(ev.content)}</div>`;
  } else if (ev.type === "start") {
    body = `<b>시작</b> <small style="color:var(--mute)">${esc(ev.file || "")}</small>`;
  } else if (ev.type === "interrupt") {
    body = `<b style="color:var(--warn)">⏸ ${esc(ev.content)}</b>`;
  } else if (ev.type === "error") {
    body = `<div class="warn">오류</div><pre>${esc(ev.content)}</pre>`;
  } else if (ev.type === "system") {
    body = `<details><summary>시스템 프롬프트</summary><pre>${esc(ev.content)}</pre></details>`;
  } else {
    body = ev.state ? `<pre>${esc(pretty(ev.state))}</pre>` : "";
  }
  return `<div class="ev"><div class="t">${ev.t ?? ""}s</div><div>${node}${body}</div></div>`;
}

function sections(list) {
  return list.map(s => `<div class="sec"><b>${esc(s.heading)}</b><div class="txt">${cites(s.body)}</div></div>`).join("");
}

function renderResult(v) {
  if (v.status === "error") return `<h4>오류</h4><div class="warn">${esc(v.error)}</div>`;
  const r = v.result || {};
  let h = "";
  if (r.final_answer) h += `<h4>답변</h4><div class="answer">${cites(r.final_answer)}</div>`;
  if (r.citations && r.citations.length) h += `<details><summary>인용한 근거 ${r.citations.length}개</summary>${r.citations.map(c => `<pre><b>[${esc(c.chunk_id)}]</b> ${esc(c.source)} · ${esc(c.heading)}\n${esc(c.text)}</pre>`).join("")}</details>`;
  const secs = r.sections || (r.report && Array.isArray(r.report) ? r.report : (r.report && r.report.sections));
  if (secs && secs.length && typeof secs[0] === "object") h += `<h4 style="margin-top:10px">보고서</h4>${sections(secs)}`;
  if (r.draft && typeof r.draft === "object" && !Array.isArray(r.draft) && !r.draft.kind) h += `<h4 style="margin-top:10px">초안(칸)</h4><pre>${esc(pretty(r.draft))}</pre>`;
  if (r.summary && typeof r.summary === "string") h += `<h4 style="margin-top:10px">요약</h4><div class="answer">${cites(r.summary)}</div>`;
  const files = [...new Set(r.files || [])];
  if (files.length) h += `<div>${files.map(f => `<a class="dl" href="/chat/files/${encodeURIComponent(f)}">📄 ${esc(f)} 받기</a>`).join("")}</div>`;
  const probs = r.problems;
  const probList = Array.isArray(probs) ? probs : (probs && typeof probs === "object" ? Object.entries(probs).flatMap(([k, a]) => (a || []).map(x => `${k}: ${x}`)) : []);
  if (probList.length) h += `<h4 style="margin-top:10px;color:var(--err)">남은 문제 ${probList.length}개</h4><pre>${esc(probList.join("\n"))}</pre>`;
  else if (probs !== undefined) h += `<div style="color:var(--ok);margin-top:8px">근거 검사 문제 없음</div>`;
  const kv = ["outcome","kind","route","stop_reason","passed","replans","submitted"].filter(k => r[k] !== undefined);
  if (kv.length) h += `<div class="kv" style="margin-top:10px">${kv.map(k => `<span>${k}</span><span>${esc(typeof r[k] === "object" ? JSON.stringify(r[k]) : r[k])}</span>`).join("")}</div>`;
  const rest = Object.fromEntries(Object.entries(r).filter(([k]) => !["final_answer","citations","sections","report","draft","summary","files","problems","saved_path","docx_path", ...kv].includes(k)));
  if (Object.keys(rest).length) h += `<details style="margin-top:8px"><summary>나머지 결과 (${Object.keys(rest).join(", ")})</summary><pre>${esc(pretty(rest))}</pre></details>`;
  if (v.status === "waiting" && v.interrupt) {
    const d = v.interrupt.draft || {};
    h += `<div class="hitl"><b>${esc(v.interrupt.question || "결정해 주세요")}</b>
      <div class="kv" style="margin-top:6px"><span>제목</span><span>${esc(d.title)}</span><span>결재선</span><span>${esc((d.line || []).join(" → "))}</span><span>첨부</span><span>${esc(d.attachment)}</span></div>
      <details><summary>상신 본문</summary><pre>${esc(d.body)}</pre></details>
      <div class="row"><input type="text" class="newtitle" placeholder="제목을 고치려면 입력 후 '제목 수정'" style="flex:1;min-width:200px">
      <button class="s act" data-a="edit">제목 수정</button><button class="p act" data-a="approve">승인 → 상신</button><button class="s act" data-a="reject">반려</button></div></div>`;
  }
  return h || `<div style="color:var(--mute)">결과 없음</div>`;
}

function bindHitl(res, v, onResumed) {
  res.querySelectorAll(".act").forEach(b => b.onclick = async () => {
    const action = b.dataset.a, title = res.querySelector(".newtitle").value.trim();
    if (action === "edit" && !title) { res.querySelector(".newtitle").focus(); return; }
    res.querySelectorAll("button").forEach(x => x.disabled = true);
    try { await api(`/chat/api/run/${v.id}/resume`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action, title})}); onResumed(); }
    catch (e) { alert(e.message); res.querySelectorAll("button").forEach(x => x.disabled = false); }
  });
}

async function loadFiles() {
  const r = await api("/chat/api/uploads");
  renderFiles(r.files);
}
function renderFiles(files) {
  $("#files").innerHTML = files.length ? files.map(f => `<li><span>${esc(f.name)}</span><button data-n="${esc(f.name)}" title="삭제">✕</button></li>`).join("")
    : `<li style="color:var(--mute)">올린 문서 없음</li>`;
  $("#files").querySelectorAll("button").forEach(b => b.onclick = async () => renderFiles((await api(`/chat/api/uploads?name=${encodeURIComponent(b.dataset.n)}`, {method:"DELETE"})).files));
}
async function uploadFiles(list) {
  for (const f of list) {
    const fd = new FormData(); fd.append("file", f);
    try { renderFiles((await api("/chat/api/uploads", {method:"POST", body:fd})).files); }
    catch (e) { alert(`${f.name}: ${e.message}`); }
  }
}
const drop = $("#drop");
drop.onclick = () => $("#file").click();
$("#file").onchange = e => uploadFiles(e.target.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); uploadFiles(e.dataTransfer.files); };
$("#send").onclick = send;
$("#text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); };
init();
</script>
</body>
</html>
